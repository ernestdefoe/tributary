ernestdefoe-tributary:

  forum:
    # 🚨 Not simply "Reply": core already puts a Reply on every post, and two
    # buttons a centimetre apart with the same word on them is a coin toss.
    reply_to: Reply in thread
    in_reply_to: "In reply to {username}"
    reply_count: "{count, plural, one {# reply} other {# replies}}"
    branch_empty: Nothing here any more.
    # Heard only by a screen reader: the indent draws this, so something
    # has to say it. `aria-level` is not valid on a list item, so it is text.
    reply_context: "Level {depth}, in reply to {username}."
    load_more: Show more replies
    answering: "Answering {username}"
    answering_cancel: Reply to the discussion instead
